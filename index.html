<!DOCTYPE html><html lang="zh-Hant" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VRT ERP · PSJERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: fixed left rail (module groups) + sticky top bar + single scrolling work column; right-side detail drawer. Phone: rail becomes a slide-in sheet. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --sunk:#E4E8ED;
  --ink:#15202B; --ink-2:#465566; --muted:#768494; --line:#D6DCE3; --line-2:#E6EAEF;
  --accent:#1F4FA8; --accent-2:#163C82; --accent-soft:#E2E9F7; --on-accent:#FFFFFF;
  --good:#1D7A4C; --good-soft:#DFF1E7; --warn:#A86A0C; --warn-soft:#FBEFD9; --crit:#B8352A; --crit-soft:#F8E1DE;
  --s-erp:#5A6B7E; --s-prod:#0E7C78; --s-acc:#A8660E; --s-import:#6A4CB5; --s-gs:#2E7D32; --s-cloud:#1F4FA8;
  --bar:#1F4FA8; --grid:#E3E8EE;
  --f-ui:"IBM Plex Sans","Noto Sans TC","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"IBM Plex Sans Condensed","Noto Sans TC","Noto Sans Khmer","Arial Narrow",sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --rail:236px; --shadow:0 1px 2px rgba(20,32,43,.06),0 8px 24px rgba(20,32,43,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151E27; --surface-2:#1A2530; --sunk:#111920;
  --ink:#E5EBF1; --ink-2:#A8B5C2; --muted:#7B8A99; --line:#2A3746; --line-2:#22303D;
  --accent:#7FA3F2; --accent-2:#A3BEF7; --accent-soft:#1D2B45; --on-accent:#0E141A;
  --good:#5CC48F; --good-soft:#15301F; --warn:#E3A84A; --warn-soft:#352812; --crit:#F0857A; --crit-soft:#3A1C19;
  --s-erp:#93A3B5; --s-prod:#4CC2BC; --s-acc:#E3A84A; --s-import:#A891E8; --s-gs:#73C076; --s-cloud:#7FA3F2;
  --bar:#7FA3F2; --grid:#24313E; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151E27; --surface-2:#1A2530; --sunk:#111920;
  --ink:#E5EBF1; --ink-2:#A8B5C2; --muted:#7B8A99; --line:#2A3746; --line-2:#22303D;
  --accent:#7FA3F2; --accent-2:#A3BEF7; --accent-soft:#1D2B45; --on-accent:#0E141A;
  --good:#5CC48F; --good-soft:#15301F; --warn:#E3A84A; --warn-soft:#352812; --crit:#F0857A; --crit-soft:#3A1C19;
  --s-erp:#93A3B5; --s-prod:#4CC2BC; --s-acc:#E3A84A; --s-import:#A891E8; --s-gs:#73C076; --s-cloud:#7FA3F2;
  --bar:#7FA3F2; --grid:#24313E; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:14px 24px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px 14px;border-bottom:1px solid var(--line-2);margin-bottom:8px}
.brand-mark{width:34px;height:34px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand b{font-family:var(--f-disp);font-size:17px;letter-spacing:.01em;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--muted)}
.nav-g{padding:10px 16px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 16px;margin:0 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav a .ic{width:20px;text-align:center;font-size:15px}
.nav a .ct{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;padding:14px 16px 0;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line-2)}
.ro-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:99px;background:var(--crit-soft);color:var(--crit);font-weight:600;font-size:11px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px}
.menu-btn{display:none}
.search{position:relative;flex:1;max-width:520px;min-width:0}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:40}
.sres button{display:flex;width:100%;gap:10px;align-items:baseline;padding:8px 12px;border:0;background:none;text-align:left;cursor:pointer;border-bottom:1px solid var(--line-2)}
.sres button:hover{background:var(--surface-2)}
.sres .k{font-size:11px;color:var(--muted);min-width:64px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.lang button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:17px;height:17px;stroke:var(--ink-2);fill:none;stroke-width:1.8}
.user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:600;color:var(--ink);font-size:12px}

.page{padding:22px 24px 48px;max-width:1440px;width:100%}
.ph{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-family:var(--f-disp);font-size:26px;line-height:1.15;margin:0;font-weight:600;text-wrap:balance}
.ph .sub{color:var(--ink-2);font-size:13px;margin-top:3px;max-width:72ch}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.url-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2);padding:2px 8px;border-radius:5px;margin-top:6px}
.solo .rail{display:none}.solo .app{grid-template-columns:minmax(0,1fr)}
.prod-links{margin-top:10px;display:flex;flex-direction:column;gap:5px}.prod-links a{display:block;border:1px solid var(--line-2,#d9dee8);border-radius:8px;padding:6px 8px;font-size:12px;text-decoration:none;color:inherit;background:rgba(255,255,255,.6)}.prod-links a:hover{border-color:var(--accent,#2563eb)}
.solo-bar{display:none;align-items:center;gap:8px;font-size:12.5px}
.solo .solo-bar{display:flex}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2)}
.btn.dng{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--line);background:none;padding:6px 12px;cursor:pointer;font-size:12.5px;color:var(--ink-2);font-weight:500}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 12px}
.toolbar .grow{flex:1;min-width:180px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-width:0}
.inp:disabled{background:var(--surface-2);color:var(--muted)}
.custom-range{display:flex;gap:6px;align-items:center}
.custom-range input{width:140px}

/* ---------- cards / kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--f-disp);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.01em}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .d{font-size:11.5px;color:var(--muted)}
.kpi.warn{box-shadow:inset 3px 0 0 var(--warn)}.kpi.crit{box-shadow:inset 3px 0 0 var(--crit)}.kpi.good{box-shadow:inset 3px 0 0 var(--good)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-disp);font-size:17px;font-weight:600;margin:0 0 4px}
.panel h3{font-size:13px;margin:0 0 8px;color:var(--ink-2);font-weight:600}
.panel .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.mt{margin-top:14px}

/* ---------- badges ---------- */
.src{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);padding:1px 7px 1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-2);white-space:nowrap}
.src i{width:7px;height:7px;border-radius:2px;display:inline-block}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.good{background:var(--good-soft);color:var(--good)}.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.crit{background:var(--crit-soft);color:var(--crit)}.st.info{background:var(--accent-soft);color:var(--accent-2)}
.st.neu{background:var(--surface-2);color:var(--ink-2)}
.diff-pos{color:var(--good)}.diff-neg{color:var(--crit)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11.5px;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;white-space:nowrap}
.t td.wrap{white-space:normal;min-width:180px}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:var(--surface-2)}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.t tr.del td{opacity:.5;text-decoration:line-through}
.t tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 2px;font-size:12px;color:var(--muted);flex-wrap:wrap}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.38);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:51;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h2{font-family:var(--f-disp);font-size:20px;margin:0;font-weight:600}
.dh .x{margin-left:auto}
.db{overflow-y:auto;padding:16px 18px;flex:1}
.df{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{margin-bottom:18px}
.sec h4{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.kv div{min-width:0}.kv dt{font-size:11.5px;color:var(--muted)}.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note{font-size:12.5px;border-radius:7px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.note.info{background:var(--accent-soft);border-color:transparent;color:var(--accent-2)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:86vh;overflow:auto;background:var(--surface);border-radius:10px;z-index:52;box-shadow:var(--shadow);padding:20px}
.modal h2{font-family:var(--f-disp);margin:0 0 8px;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:60;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- login ---------- */
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:16px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:var(--shadow)}
.login-card h1{font-family:var(--f-disp);font-size:28px;margin:12px 0 2px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}

/* ---------- charts / meters ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .b{fill:var(--bar)}
.chart .b:hover,.chart .b.hl{fill:var(--accent-2)}
.chart .lbl{fill:var(--ink);font-weight:600}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;z-index:80;white-space:nowrap}
.meter{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.meter .trk{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter .fill{height:100%;background:var(--bar);border-radius:0 3px 3px 0}
.meter .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tri>div{background:var(--surface);padding:12px 14px;min-width:0}
.tri .v{font-family:var(--f-disp);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.formula{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:8px 10px;color:var(--ink-2);overflow-wrap:anywhere}
.wf{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.wf .trk{height:14px;position:relative}
.wf .seg{position:absolute;top:0;height:100%;border-radius:2px;background:var(--bar)}
.wf.tot .seg{background:var(--ink)}
.wf.mg .seg{background:var(--good)}

/* ---------- import ---------- */
.drop{border:2px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--f-disp);font-size:18px;display:block}
.steps{display:flex;gap:4px;flex-wrap:wrap;font-size:11.5px;margin:12px 0}
.steps span{padding:3px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2)}
.steps span.on{background:var(--accent-soft);color:var(--accent-2);border-color:transparent;font-weight:600}
.steps span.done{color:var(--good)}
.conf{display:grid;grid-template-columns:150px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13px;padding:3px 0}

/* ---------- telegram preview ---------- */
.tg{background:#17212B;border-radius:12px;padding:14px;color:#E9EEF3;max-width:420px;font-size:13.5px}
.tg .bub{background:#2B5278;border-radius:10px 10px 10px 3px;padding:10px 12px;margin-bottom:6px;line-height:1.45}
.tg .bub b{color:#fff}
.tg .kb{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tg .kb a{background:#24384D;color:#E9EEF3;text-decoration:none;text-align:center;padding:8px 6px;border-radius:6px;font-size:12.5px}
.tg .kb a:hover{background:#2F4A65}
.tg .meta{font-size:11px;color:#8A9BAD;margin-bottom:8px}

/* ---------- responsive ---------- */
@media (max-width:1100px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;bottom:0;z-index:55;width:min(280px,86vw);transform:translateX(-102%);transition:transform .2s;height:auto;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:var(--shadow)}
  .menu-btn{display:grid}
  .top{padding:8px 16px;flex-wrap:wrap}
  .search{order:5;flex-basis:100%;max-width:none}
  .user-chip .nm{display:none}
  .page{padding:16px 16px 40px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .ph h1{font-size:22px}
  .form,.kv{grid-template-columns:minmax(0,1fr)}
  .tri{grid-template-columns:minmax(0,1fr)}
  .meter{grid-template-columns:90px minmax(0,1fr) 64px}
  /* card-style tables on phone */
  .t.cards thead{display:none}

const PROD_CACHE=new Map();
function prodDay(d,L){
 const ds=ymd(d), key=ds+'|'+L; if(PROD_CACHE.has(key))return PROD_CACHE.get(key);
 const ym=ds.slice(0,7), mf=0.9+0.2*hsh('m'+ym);
 const ops=28+Math.floor(hsh('o'+key)*10), avail=ops*480, eff=Math.min(0.78,(0.46+0.24*hsh('e'+key))*mf);
 const std=Math.round(avail*eff), smv=6+hsh('s'+L+ym)*8, sewn=Math.round(std/smv);
 const r={ds,line:'Line '+L,ops,avail,std,sewn,cut:Math.round(sewn*(0.95+0.12*hsh('c'+key))),packed:Math.round(sewn*(0.9+0.12*hsh('p'+key)))};
 PROD_CACHE.set(key,r); return r;

 do{cloudSetState('busy',tt('下載 ','Downloading ')+m.fn+' '+fmt(Math.min(total,off+3000))+'/'+fmt(total));
  const j=await cget({action:'erp_get',sheet:m.sheet,key:m.key,offset:off,limit:3000}); rows=rows.concat(j.rows); total=j.total; off+=3000}while(off<total);
 const C=rows.length?(await Promise.resolve(cols)):cols;
 const recs=rows.map(a=>{const o={};C.forEach((c,i)=>{let v=a[i];if(types[i]==='n'){v=(v===''||v==null)?null:+v}else if(types[i]==='z')v=null;else v=v==null?'':String(v);o[c]=v});return o});
 recs.forEach((r,i)=>{if(r.order_year==='')r.order_year=null;if(!r.source_system){r.source_system='LEGACY_ERP';r.source_record_id=(m.fn||m.rep)+'#'+(i+1);r.source_file=m.file;r.import_batch_id=m.batch;r.import_key=m.key;r.synced_at=m.at}});
 const meta={key:m.key,rep:m.rep,fn:m.fn,file:m.file,rows:recs.length,label:m.label,range:PJ(m.range),asof:m.asof||'',year:m.year?+m.year:null,totals:PJ(m.totals),checks:PJ(m.checks)||[],at:m.at,batch:m.batch,version:String(m.version),dirty:false,cloud:true};
 storeBatch(m.rep,m.key,meta,recs);
}

async function cloudSync(manual,only){
 if(CLOUD.busy||isDemo())return; const want=only&&only.size?f=>only.has(REP_SHEET[f.rep]||f.sheet):()=>true; if(!cloudReady()){cloudSetState('off');if(manual)toast(tt('請先在「設定 → 雲端同步」輸入同步密碼','Enter the sync password in Settings → Cloud sync first'));return}
 CLOUD.busy=true; let pulled=0, pushed=0;
 try{
  cloudSetState('busy',tt('讀取雲端清單…','Reading cloud list…'));
  for(const k of (DB.dropq||[]).slice()){await cpost({action:'erp_drop',key:k});DB.dropq=DB.dropq.filter(x=>x!==k);persist()}
  const man=await cget({action:'erp_manifest'}); CLOUD.url=man.url||''; const files=man.files||[]; CLOUD.files=files.length;
  if(files.length&&!only){const inCloud=new Set(files.map(m=>String(m.key)));const gone=(DB.erpfiles||[]).filter(f=>f.version&&!f.dirty&&!inCloud.has(String(f.key))&&!SNAPREP[f.rep]);if(gone.length&&gone.length<=Math.max(3,files.length*0.2)){gone.forEach(dropLocalBatch);updateDataRange();GC.clear();COSTC.clear();persist()}}
  const justPushed=new Set();
  for(const f of (DB.erpfiles||[]).filter(f=>(f.dirty||!f.version)&&want(f))){await pushBatch(f);justPushed.add(f.key);pushed++;persist()}
  for(const m of files){if(justPushed.has(m.key)||!want(m))continue;const loc=(DB.erpfiles||[]).find(f=>f.key===m.key);if(loc&&(loc.dirty||String(loc.version)===String(m.version)))continue;await pullBatch(m);pulled++;persist()}
  if(!only)await syncTpl(man);
  for(const n of NOTEQ.splice(0)){await cpost({action:'erp_note',id:n.id,ds:n.ds,notes:n.notes,tags:n.tags,user:'paul.weng'})}
  (man.notes||[]).forEach(n=>{const arr=DB[n.ds]||[];const r=arr.find(x=>x.id===n.id);if(!r)return;if(r._nat&&r._nat>String(n.at))return;r.notes=String(n.notes||'');r.tags=String(n.tags||'').split(',').map(x=>x.trim()).filter(Boolean);r._nat=String(n.at)});
  if((DB.digest||[]).length&&!(DB.erpfiles||[]).some(f=>f.dirty||!f.version)){try{await sendDigest(false)}catch(e){console.error(e)}}
  CLOUD.last=nowStamp(); LS.set('psjerp_cloud_last',CLOUD.last); cloudSetState('ok'); persist();
  if(pulled||pushed||manual){toast(tt('雲端同步完成','Cloud sync done')+(pushed?` · ${tt('上傳','up')} ${pushed}`:'')+(pulled?` · ${tt('下載','down')} ${pulled}`:''));rerender()}
 }catch(e){console.error(e);cloudSetState('err',String(e.message||e));if(manual||/密碼|KEY/.test(String(e.message)))toast(tt('雲端同步失敗：','Cloud sync failed: ')+(e.message||e))}
 finally{CLOUD.busy=false}
}

let IMPQ=[];
async function readAOA(file){
 if(/\.(csv|txt|tsv)$/i.test(file.name)){const buf=await file.arrayBuffer();let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){try{txt=new TextDecoder('big5').decode(buf)}catch(e2){txt=new TextDecoder().decode(buf)}}
  txt=txt.replace(/^﻿/,'');const dl=txt.split('\n').slice(0,20).join('\n').includes('\t')?'\t':',';
  return {aoa:txt.split(/\r?\n/).map(line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'&&line[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"'&&cur==='')q=true;else if(ch===dl){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}),sheets:[file.name.replace(/\.[^.]+$/,'')]}}
 if(!window.XLSX)throw new Error(tt('Excel 解析器載入失敗，請檢查網路後重新整理','Excel parser failed to load — check the connection and reload'));
 const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false,raw:true});const sn=wb.SheetNames[0];
 return {aoa:XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}),sheets:wb.SheetNames};
}
async function handleFiles(list){
 const files=[...list]; if(!files.length)return; toast(tt('讀取中…','Reading…'));
 let generic=null;
 for(const f of files){
  try{const {aoa,sheets}=await readAOA(f); const R=detectReport(aoa);
   if(R){const P=PARSERS[R.parser](aoa,f,R.k); const existing=(DB.erpfiles||[]).find(x=>x.key===P.meta.key);
    IMPQ=IMPQ.filter(q=>q.P.meta.key!==P.meta.key); IMPQ.push({file:f.name,size:f.size,R,P,existing});}
   else generic={f,aoa,sheets};
  }catch(e){IMPQ.push({file:f.name,err:String(e.message||e)})}
 }
 if(generic&&!IMPQ.length){await handleFile(generic.f);return}
 if(generic)IMPQ.push({file:generic.f.name,generic:generic.f});
 go('smart-import'); rerender();
}

function rangeFor(pt,a,st){

function subBuckets(st){

 if(st.pt==='H'){const y=R.from.getFullYear();for(let m=0;m<12;m++)for(const d of [1,16]){const f=new Date(y,m,d);if(f>TODAY)break;const e=d===1?new Date(y,m,15):new Date(y,m+1,0);out.push({l:y+'-'+pad(m+1)+(d===1?' 上':' 下'),R:{from:f,to:e},pt:'H',a:ymd(f),on:ymd(f)===ymd(R.from)})}return out}
 if(st.pt==='Q'){const y=R.from.getFullYear();for(let q=0;q<4;q++){const f=new Date(y,q*3,1);if(f>TODAY)break;out.push({l:y+'-Q'+(q+1),R:{from:f,to:new Date(y,q*3+3,0)},pt:'Q',a:ymd(f),on:q===Math.floor(R.from.getMonth()/3)})}return out}
 if(st.pt==='Y'||st.pt==='ALL'){for(let y=DATA_Y0;y<=TODAY.getFullYear();y++)out.push({l:String(y),R:{from:new Date(y,0,1),to:new Date(y,11,31)},pt:'Y',a:y+'-01-01',on:st.pt==='Y'&&y===R.from.getFullYear()});return out}
 const span=(R.to-R.from)/864e5;
 if(span<=62){for(let d=new Date(R.from);d<=R.to&&d<=TODAY;d=addD(d,1))out.push({l:ymd(d).slice(5),R:{from:d,to:d},pt:'D',a:ymd(d)});return out}
 for(let m=new Date(R.from.getFullYear(),R.from.getMonth(),1);m<=R.to&&m<=TODAY;m=new Date(m.getFullYear(),m.getMonth()+1,1)){const e=new Date(m.getFullYear(),m.getMonth()+1,0);out.push({l:monthKey(m),R:{from:m<R.from?R.from:m,to:e>R.to?R.to:e},pt:'M',a:ymd(m)})}
 return out;
}

function cell(r,c){
 const v=r[c.f];
 switch(c.tp){
  case 'num':return fmt(v);case 'n1':return fmt(v,1);case 'n2':return fmt(v,2);case 'n3':return fmt(v,3);
  case 'money':return money(v);case 'money3':return v===0?`<span class="st crit">$0.00</span>`:money(v,v<1?3:2);
  case 'date':return esc(v||'—');case 'pct':return v==null?'—':fmt(v,1)+'%';
  case 'smv':return v>0.01?fmt(v,2):`<span class="st warn">${v===0.01?'0.01':tt('缺','none')}</span>`;
  case 'src':return srcBadge(v)+(r._ovr?' '+srcBadge('VRT_ONEERP'):'');
  case 'ost':{const s=ORDER_ST[v]||['neu',v];return stChip(s[0],t(s[1]))}
  case 'bt':return v==='main'?stChip('info',t('main')):stChip('neu',t('trim'));
  case 'rst':return v==='pass'?stChip('good',t('pass')):v==='fail'?stChip('crit',t('fail')):stChip('warn',t('hold'));
  default:return c.mono?`<span class="mono">${esc(v||'—')}</span>`:esc(v==null||v===''?'—':v);
 }
}
const isNumCol=c=>['num','n1','n2','n3','money','money3','pct','smv'].includes(c.tp);
function filterRows(k){
 const cfg=CFG[k],st=S(k); let rows=cfg.snap?snapRows(k,asOfDate(rangeOf(st))).rows:baseRows(k);
 if(cfg.yearF){const R=rangeOf(st);if(!R.all)rows=rows.filter(r=>{const y=+r[cfg.yearF];return y&&y>=R.from.getFullYear()&&y<=R.to.getFullYear()})}
 if(cfg.date){const R=rangeOf(st);rows=rows.filter(r=>inR(r[cfg.date]||(k==='bom'?(DB.orders.find(o=>o.od_no===r.od_no)||{}).order_date:''),R))}
 if(st.cust)rows=rows.filter(r=>r.cust===st.cust);
 if(st.q){const q=st.q.toLowerCase();rows=rows.filter(r=>cfg.cols.some(c=>String(r[c.f]??'').toLowerCase().includes(q)))}
 return rows;
}
function tableHTML(k,rows,opts={}){
 const cfg=CFG[k]; const per=opts.per||25, st=S(k); const pages=Math.max(1,Math.ceil(rows.length/per)); if(st.page>=pages)st.page=pages-1;
 const slice=opts.all?rows:rows.slice(st.page*per,st.page*per+per);
 if(!rows.length)return `<div class="note">${esc(t('no_data'))}</div>`;
 let h=`<div class="tbl-wrap"><table class="t cards"><thead><tr>${cfg.cols.map(c=>`<th class="${isNumCol(c)?'r':''}">${esc(t(c.l))}</th>`).join('')}</tr></thead><tbody>`;
 slice.forEach(r=>{h+=`<tr class="${r._snap?'':'click'}" ${r._snap?'':`onclick="openRec('${k}','${esc(r.id)}')"`}>${cfg.cols.map(c=>`<td class="${isNumCol(c)?'r':''} ${c.lead?'lead':''} ${c.wrap?'wrap':''}" data-l="${esc(t(c.l))}">${cell(r,c)}</td>`).join('')}</tr>`});
 h+=`</tbody></table></div>`;
 if(!opts.all)h+=`<div class="pager"><span>${esc(t('rows_shown'))} ${fmt(st.page*per+1)}–${fmt(Math.min(rows.length,(st.page+1)*per))} ${esc(t('of'))} ${fmt(rows.length)} ${esc(t('records'))} · <span class="src"><i style="background:var(--warn)"></i>${esc(t('demo'))}</span></span>
  <span style="display:flex;gap:6px"><button class="btn sm" ${st.page<=0?'disabled':''} onclick="S('${k}').page--;rerender()">${esc(t('prev'))}</button><button class="btn sm" ${st.page>=pages-1?'disabled':''} onclick="S('${k}').page++;rerender()">${esc(t('next'))}</button></span></div>`;
 return h;
}

  if(k==='fabric'){const yd=rows.filter(r=>!r.unit||/YD/i.test(r.unit));return kpi(tt('料號 × 顏色','Item × colour'),fmt(rows.length))+kpi(tt('庫存量（同 ERP 合計）','Stock qty (= ERP total)'),fmt(sum(rows,'balance'),2),'',rows.length-yd.length?tt('含 ','incl. ')+(rows.length-yd.length)+tt(' 列單位非碼（',' rows not in yd (')+[...new Set(rows.filter(r=>!(!r.unit||/YD/i.test(r.unit))).map(r=>r.unit))].join('/')+')':'')+kpi(tt('負庫存列','Negative lines'),fmt(rows.filter(r=>r.balance<0).length),'','',rows.some(r=>r.balance<0)?'crit':'')+kpi(t('rolls'),fmt(sum(rows,'rolls')),'',rows.some(r=>r.rolls<0)?tt('ERP 疋數未維護','rolls not maintained'):'',rows.some(r=>r.rolls<0)?'warn':'')}
  if(k==='accessories')return kpi(tt('品項','Items'),fmt(rows.length))+kpi(t('balance'),fmt(sum(rows,'balance'),0));
 }
 if(k==='orders'){const op=rows.filter(r=>r.status!=='closed');const late=rows.filter(r=>r.status==='late');const due=op.filter(r=>{const d=parseD(r.delivery);return d>=TODAY&&d<=addD(TODAY,14)});
  return kpi(t('kpi_open'),fmt(op.length),'',fmt(sum(op,'qty'))+' '+t('pcs'))+kpi(t('kpi_late'),fmt(late.length),'',fmt(sum(late,r=>r.qty-r.ship_qty))+' '+t('pcs')+' '+t('outstanding'),late.length?'crit':'')+
  kpi(t('due_soon'),fmt(due.length),'','',due.length?'warn':'')+kpi(t('order_qty'),fmt(sum(rows,'qty')),t('pcs'))+kpi(t('amount'),money(sum(rows,r=>r.qty*r.price),0),'','USD')+
  kpi(t('ship_qty'),fmt(sum(rows,'ship_qty')),t('pcs'),fmt(sum(rows,'ship_qty')/Math.max(1,sum(rows,'qty'))*100,1)+'%')}
 if(k==='bom'){const ords=new Set(rows.map(r=>r.od_no));const noBom=live(DB.orders).filter(o=>!DB.bom.some(b=>b.od_no===o.od_no)).length;
  return kpi(tt('BOM 訂單數','Orders with BOM'),fmt(ords.size))+kpi(tt('用料列','Material lines'),fmt(rows.length))+kpi(t('est_cost'),money(sum(rows,'est_cost'),0))+

 if(k==='shipping'){return kpi(tt('出貨單','Shipments'),fmt(rows.length))+kpi(t('kpi_shipped'),fmt(sum(rows,'qty')),t('pcs'))+kpi(t('amount'),money(sum(rows,'amount'),0))+

/* ================= costing engine ================= */
function rates(){
 const fc=live(DB.factorycost); const smv=sum(fc,'smv_min')||1;
 const lab=sum(fc,r=>r.payroll+r.ot), oh=sum(fc,r=>r.electricity+r.water+r.repair+r.spare+r.consumables+r.depreciation+r.other);
 return {labor:lab/smv, oh:oh/smv, total:(lab+oh)/smv, pcs:sum(fc,'prod_qty'), cost:lab+oh};
}
const TERMS={ADI:{term:'DDP',freight:0.18,duty:0.00},BEREN:{term:'FOB',freight:0.04,duty:0},ARAMAR:{term:'FOB',freight:0.04,duty:0},ALSCO:{term:'FOB',freight:0.04,duty:0}};
function wavgPrice(no,color){const ps=DB.purchase.filter(p=>p.material_no===no&&p.color===color&&!p.deleted_at);const q=sum(ps,'qty');return q?sum(ps,p=>p.qty*p.price)/q:null}
function costOrder(o,basis){
 const R=rates(); const bom=DB.bom.filter(b=>((o.od_no&&b.od_no===o.od_no)||(o.my_no&&keyN(b.my_no)===keyN(o.my_no)))&&!b.deleted_at);
 let mat=null; if(bom.length){mat=sum(bom,b=>{const p=basis==='wavg'?(wavgPrice(b.material_no,b.color)??b.price):b.price;return b.total_use*p})/Math.max(1,o.qty)}
 const smvOk=o.smv>0.01; const tm=TERMS[o.cust]||{term:'FOB',freight:0.04,duty:0};
 const labor=smvOk?o.smv*R.labor:null, oh=smvOk?o.smv*R.oh:null, other=0.02;
 const total=(mat!=null&&labor!=null)?mat+labor+oh+tm.freight+tm.duty+other:null;
 const margin=total!=null?o.price-total:null;
 return {mat,labor,oh,freight:tm.freight,duty:tm.duty,other,total,price:o.price,margin,mpct:margin!=null&&o.price?margin/o.price*100:null,term:tm.term,smvOk,hasBom:bom.length>0};

 const pr=minmax(rows.map(r=>r.purchase_date));

 else{const P=PM[k]; const srcs=P?[...new Set(P.metrics.filter(m=>m.src).map(m=>m.src))]:[]; const cfg=CFG[k];

/* ---------- export: Excel with 說明 + 資料 sheets (current period + filters) ---------- */
function exportCSV(k){
 const cfg=CFG[k]; const rows=filterRows(k); const st=S(k); const R=rangeOf(st); const per=cfg.snap?'As of '+ymd(asOfDate(R)):periodLabel(st.pt,R);
 const stamp=nowStamp().replace(/[-: ]/g,'').slice(0,12); const name=`VRT_${t(k)}_${per.replace(/[^\w\-]/g,'')}_${stamp.slice(0,8)}-${stamp.slice(8,12)}`.replace(/[\/\\ ]/g,'');
 const cols=cfg.cols.filter(c=>c.tp!=='src'); const head=cols.map(c=>t(c.l)).concat(['source_file']);
 const isTxt=c=>/^(my_no|od_no|po_no|purchase_no|material_no|bl_no|style|color|clr|clr_no|size)$/.test(c.f);
 const data=rows.map(r=>cols.map(c=>{const v=r[c.f];if(v==null||v==='')return '';if(isTxt(c))return String(v);if(isNumCol(c))return +v||0;return v}).concat([r.source_file||'']));
 const files=[...new Set(rows.map(r=>r.source_file).filter(Boolean))];
 const tots=cols.map((c,i)=>isNumCol(c)&&!/price|pct|smv/.test(c.tp+c.f)?sum(data,r=>+r[i]||0):null);
 const info=[['VRT ERP · '+t(k)],['匯出時間',nowStamp()],['期間',per],['客戶篩選',st.cust||'全部'],['關鍵字',st.q||'—'],['筆數',rows.length],['來源檔',files.slice(0,30).join(', ')+(files.length>30?' …':'')],[''],['欄位','合計']].concat(cols.map((c,i)=>[t(c.l),tots[i]==null?'':tots[i]]).filter(x=>x[1]!==''));
 audit('export',name,'EXPORT',null,{rows:rows.length,period:per});
 if(!window.XLSX){showCSV(name+'.csv',[head].concat(data));return}
 try{const wb=XLSX.utils.book_new();const s1=XLSX.utils.aoa_to_sheet(info);s1['!cols']=[{wch:14},{wch:60}];XLSX.utils.book_append_sheet(wb,s1,'說明');
  const s2=XLSX.utils.aoa_to_sheet([head].concat(data));s2['!cols']=head.map(h=>({wch:Math.max(8,Math.min(30,String(h).length*2+2))}));s2['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:data.length,c:head.length-1}})};s2['!freeze']={xSplit:0,ySplit:1};
  // keep identifiers as text
  cols.forEach((c,ci)=>{if(!isTxt(c))return;for(let ri=1;ri<=data.length;ri++){const a=XLSX.utils.encode_cell({r:ri,c:ci});if(s2[a]){s2[a].t='s';s2[a].z='@'}}});
  XLSX.utils.book_append_sheet(wb,s2,'資料');XLSX.writeFile(wb,name+'.xlsx');toast(tt('已匯出 ','Exported ')+fmt(rows.length)+tt(' 筆',' rows'))}
 catch(e){console.error(e);showCSV(name+'.csv',[head].concat(data))}
}

 function styleIdx(){

  live(DB.smv||[]).forEach(r=>{ const s=get(r.style); if(!s)return; s.erp=r; if(!s.name)s.name=r.style_name||'' });
  const ov=ordersView(); ov.forEach(o=>{ const s=get(o.style); if(!s)return; if(!s.name&&o.style_name)s.name=o.style_name; if(o.cust)s.custs.add(o.cust); s.orders.n++; s.orders.qty+=+o.qty||0; if(o.status!=='closed')s.orders.open+=Math.max(0,(+o.qty||0)-(+o.ship_qty||0)); if(String(o.order_date)>s.orders.last)s.orders.last=String(o.order_date); s.orders.ids.push(o.id) });

  const keysArr=[...S.keys()];
  const ieGet=sty=>{ const k=ks(sty); if(!k)return null; if(S.has(k))return S.get(k); if(k.length>=5){ const hit=keysArr.filter(x=>x.startsWith(k)); if(hit.length===1)return S.get(hit[0]) } return get(sty) };   /* IE 寫 A2134JGR，訂單寫 A2134JGR-MC → 同一款 */
  rows.forEach(r=>{ if(r[0]==='ie'){ const [,kind,sty,v,d,appr,cust,cat,mod,by,prev,ops,gname,files,stype,tdate,notes]=r; const s=ieGet(sty); if(!s)return; s.ie.push({kind,v,d,appr,cust,cat,mod,by,prev,ops,gname,files,stype,tdate,notes}); if(cust)s.custs.add(cust); if(cat&&!s.cat)s.cat=cat; if(mod&&!s.module)s.module=mod; if(ops>s.opCount)s.opCount=ops; if(gname&&!s.name)s.name=gname } });

 function erpIdx(){ if(GC.has('crerp'))return GC.get('crerp'); const ov=ordersView(); const byPk=new Map(), byG=new Map();
  ov.forEach(o=>{ const G=gOfErp(o.cust,o.po_no), pk=nk(o.po_no); if(!pk)return; const x=byPk.get(pk)||{pk,po:o.po_no,G,qty:0,ship:0,open:0,od:'',dl:'',closed:true,n:0,styles:new Set()}; x.qty+=+o.qty||0; x.ship+=+o.ship_qty||0; x.n++; if(o.status!=='closed')x.closed=false; const od=d10(o.order_date); if(od&&(!x.od||od<x.od))x.od=od; const dl=d10(o.delivery); if(dl>x.dl)x.dl=dl; x.styles.add(o.style); byPk.set(pk,x); if(!byG.has(G))byG.set(G,[]); if(x.n===1)byG.get(G).push(x) });
  const sh=new Map(), shLast=new Map(); live(DB.shipping||[]).forEach(s=>{ const pk=nk(s.po_no); if(!pk)return; sh.set(pk,(sh.get(pk)||0)+(+s.qty||0)); const d=d10(s.ship_date); if(d>(shLast.get(pk)||''))shLast.set(pk,d) });
  const r={byPk,byG,sh,shLast,ov}; GC.set('crerp',r); return r }
 function matchPo(E,G,po){ const pk=nk(po), d=dk(po); const c=E.byG.get(G)||[]; if(E.byPk.has(pk)&&E.byPk.get(pk).G===G)return [pk];
  let h=c.filter(x=>dk(x.po)===d&&d); if(h.length)return h.map(x=>x.pk);
  if(d&&d.length>=4){ h=c.filter(x=>{const y=dk(x.po);return y.length>=4&&(d.startsWith(y)||y.startsWith(d))}); if(h.length)return h.map(x=>x.pk) }
  return E.byPk.has(pk)?[pk]:[] }
 function cmpStat(S){ const E=erpIdx(); const pos=new Map();
  S.recs.forEach(r=>{ const k=r.G+'|'+r.po; let p=pos.get(k); if(!p){p={G:r.G,po:r.po,sq:0,ss:0,so:0,lines:0,podate:'',styles:new Set()};pos.set(k,p)} p.sq+=r.qty; p.ss+=r.shipped; p.so+=r.open; p.lines++; if(r.podate&&(!p.podate||r.podate<p.podate))p.podate=r.podate; p.styles.add(r.style) });
  const out=[...pos.values()].map(p=>{ const pks=matchPo(E,p.G,p.po); const ex=pks.map(k=>E.byPk.get(k)).filter(Boolean); p.epo=pks.map(k=>(E.byPk.get(k)||{}).po||k).join('、'); p.pks=pks; p.eq=ex.length?ex.reduce((t,x)=>t+x.qty,0):null; p.es=ex.length?pks.reduce((t,k)=>t+(E.sh.get(k)||0),0):null; p.closed=ex.length?ex.every(x=>x.closed):null; p.eod=ex.map(x=>x.od).filter(Boolean).sort()[0]||''; p.elast=pks.map(k=>E.shLast.get(k)||'').sort().pop()||''; return p });
  const dupE=new Map(); out.forEach(p=>{ if(p.epo)dupE.set(p.epo,(dupE.get(p.epo)||0)+1) });
  out.forEach(p=>{ const m=[]; let cls='ok';
   if(!p.pks.length){ m.push(L('ERP 沒有這張 PO（可能還沒建單）','PO not in ERP')); cls='bad' }
   else if(dupE.get(p.epo)>1){ m.push(L('同一張 PO 寫成兩種號碼，合起來再對 ERP','same PO written two ways')); cls='warn' }
   else { const dq=p.sq-p.eq, ds=p.ss-p.es;
    if(Math.abs(dq)<0.5)m.push(L('訂單量相符','qty matches')); else if(dq>0){m.push(L('報表訂單量比 ERP 多（要查）','report qty > ERP'));cls='bad'} else if(p.closed){m.push(L('報表只列部分款色（ERP 已結案，其餘已出完）','report lists part of the PO (ERP closed)'));cls='grey'} else {m.push(L('報表少列 ERP 還沒出完的款色（要補）','report misses open ERP lines'));cls='warn'}
    if(ds>0.5){m.push(L('報表已出貨比 ERP 多（要查）','report shipped > ERP'));cls='bad'} else if(Math.abs(dq)<0.5&&ds<-0.5){m.push(L('報表已出貨比 ERP 少（報表沒更新）','report shipped < ERP'));if(cls==='ok')cls='warn'} }
   p.judge=m.join('；'); p.cls=cls });
  /* ERP 未結但報表沒列（同一批客戶）*/
  const used=new Set(out.flatMap(p=>p.pks)); const Gs=new Set(out.map(p=>p.G));
  const miss=[]; let old=0; E.byPk.forEach(x=>{ if(x.closed||used.has(x.pk)||!Gs.has(x.G)||/^SAMPLE|^$/.test(x.pk))return; if(x.od&&x.od<'2022-01-01'){old++;return} miss.push(x) }); miss.sort((a,b)=>a.G.localeCompare(b.G)||b.qty-b.ship-(a.qty-a.ship));
  return {pos:out.sort((a,b)=>a.G.localeCompare(b.G)||String(a.po).localeCompare(String(b.po))),miss,old} }
 function cmpShip(S){ const recs=S.recs.slice().sort((a,b)=>a.date.localeCompare(b.date)); if(!recs.length)return {rows:[],extra:[]};
  const lo=addDays(recs[0].date,-7), hi=recs[recs.length-1].date; const DO=new Map();
  live(DB.shipping||[]).forEach(s=>{ const d=d10(s.ship_date); if(d<lo)return; const k=s.bl_no||(d+'|'+s.po_no); let x=DO.get(k); if(!x){x={bl:s.bl_no||'',d,G:gOfErp(s.cust,s.po_no),qty:0};DO.set(k,x)} x.qty+=+s.qty||0 });
  const used=new Set(); const D=[...DO.values()];
  const cand=r=>D.filter(x=>x.G===r.G&&!used.has(x.bl)).map(x=>Object.assign({dd:daysBetween(r.date,x.d)},x)).filter(x=>x.dd>=-7&&x.dd<=31);
  const subsets=(arr,target)=>{ const a=arr.slice(0,10); const n=a.length; let best=null; for(let m=1;m<(1<<n);m++){ let t=0,c=0; for(let k=0;k<n;k++)if(m&(1<<k)){t+=a[k].qty;c++} if(c>4)continue; if(Math.abs(t-target)<0.5){ const set=a.filter((_,k)=>m&(1<<k)); if(!best||set.length<best.length)best=set } } return best };
  const P=new Map();   /* 第 1 輪：件數完全一樣的一張；第 2 輪：同一天幾張加起來一樣；第 3 輪：差不多的 */
  const take=(r,pick)=>{ pick.forEach(x=>used.add(x.bl)); P.set(r,pick) };
  recs.forEach(r=>{ if(!r.pcs)return; const e=cand(r).filter(x=>Math.abs(x.qty-r.pcs)<0.5).sort((a,b)=>Math.abs(a.dd)-Math.abs(b.dd)); if(e.length)take(r,[e[0]]) });
  recs.forEach(r=>{ if(!r.pcs||P.has(r))return; const c=cand(r).filter(x=>x.dd<=14); const byD=new Map(); c.forEach(x=>{if(!byD.has(x.d))byD.set(x.d,[]);byD.get(x.d).push(x)}); for(const [d,g] of [...byD.entries()].sort()){ const ss=subsets(g,r.pcs); if(ss){take(r,ss);break} } });
  recs.forEach(r=>{ if(!r.pcs||P.has(r))return; const c=cand(r); const b=c.filter(x=>x.dd<=14&&x.qty>=r.pcs*0.5&&x.qty<=r.pcs*1.5).sort((a,b)=>Math.abs(a.dd)-Math.abs(b.dd)); if(b.length){ const g=c.filter(x=>x.d===b[0].d&&x.bl!==b[0].bl).slice(0,8); let best=[b[0]], bd=Math.abs(b[0].qty-r.pcs); for(let m=1;m<(1<<g.length);m++){ let t=b[0].qty,set=[b[0]]; for(let k=0;k<g.length;k++)if(m&(1<<k)){t+=g[k].qty;set.push(g[k])} if(set.length>4)continue; if(Math.abs(t-r.pcs)<bd){bd=Math.abs(t-r.pcs);best=set} } take(r,best);return} if(r.date<today()){ const b2=c.filter(x=>x.qty>=r.pcs*0.3).sort((a,b)=>Math.abs(a.dd)-Math.abs(b.dd)); if(b2.length)take(r,[b2[0]]) } });
  const rows=recs.map(r=>{ const pick=P.get(r)||[];
   const ep=pick.length?pick.reduce((t,x)=>t+x.qty,0):null;
   let st,cls; if(r.pcs==null&&ep==null){st=r.date>today()?L('還沒到出貨日（排程沒件數）','not due yet'):L('排程沒寫件數','no pcs in schedule');cls=r.date>today()?'':'warn'} else if(r.pcs==null){st=L('排程沒寫件數，ERP 有出貨','no pcs in schedule; ERP shipped');cls='warn'} else if(ep==null){ st=r.date>today()?L('還沒到出貨日','not due yet'):L('ERP 找不到這批出貨（還沒出或還沒建出貨單）','no ERP shipment found'); cls=r.date>today()?'':'bad' } else if(Math.abs((r.pcs||0)-ep)<0.5){st=L('相符','matches');cls='ok'} else {st=L('件數不同','qty differs');cls='warn'}
   return Object.assign({},r,{dos:pick.map(x=>x.bl).join('、'),edate:[...new Set(pick.map(x=>x.d))].join('、'),ep,st,cls}) });
  const months=new Set(recs.map(r=>r.date.slice(0,7))); const extra=D.filter(x=>!used.has(x.bl)&&months.has(x.d.slice(0,7))&&x.qty>=100&&x.d<=hi).sort((a,b)=>a.d.localeCompare(b.d));
  return {rows,extra} }
 const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
 function cmpVol(S){ const E=erpIdx(); const em=new Map(), cmt=new Map();
  E.ov.forEach(o=>{ const m=d10(o.order_date).slice(0,7); if(!m)return; const G=gOfErp(o.cust,o.po_no); const k=G+'|'+m; em.set(k,(em.get(k)||0)+(+o.qty||0)); if(/^CMT/i.test(String(o.po_no||'')))cmt.set(k,(cmt.get(k)||0)+(+o.qty||0)) });
  const vm=new Map(); const Gs=new Set(); S.recs.forEach(r=>{ const k=r.G+'|'+r.m; vm.set(k,(vm.get(k)||0)+r.qty); Gs.add(r.G) });
  const years=[...new Set(S.recs.map(r=>r.m.slice(0,4)))].sort(); const Y=[]; const M=[];
  Gs.forEach(G=>years.forEach(y=>{ let v=0,e=0,c=0,has=false; for(let m=1;m<=12;m++){ const k=G+'|'+y+'-'+String(m).padStart(2,'0'); if(vm.has(k))has=true; const vv=vm.get(k)||0, ee=em.get(k)||0, cc=cmt.get(k)||0; v+=vv; e+=ee; c+=cc; if(Math.abs(vv-(ee-cc))>=1000)M.push({G,m:y+'-'+String(m).padStart(2,'0'),v:vv,e:ee-cc}) } if(has||e)Y.push({G,y,v,e,c}) }));
  const others=new Map(); E.ov.forEach(o=>{ if(d10(o.order_date)<'2024-01-01')return; const G=gOfErp(o.cust,o.po_no); if(Gs.has(G)||/樣品/.test(G))return; const x=others.get(G)||{G,q:0,po:new Set(),nm:new Set()}; x.q+=+o.qty||0; x.po.add(o.po_no); if(x.nm.size<3&&o.style_name)x.nm.add(o.style_name); others.set(G,x) });
  return {Y:Y.sort((a,b)=>a.G.localeCompare(b.G)||a.y.localeCompare(b.y)),M:M.sort((a,b)=>a.G.localeCompare(b.G)||a.m.localeCompare(b.m)),others:[...others.values()].filter(x=>x.q>0).sort((a,b)=>b.q-a.q)} }
 function compute(){ if(GC.has('crcmp'))return GC.get('crcmp'); const r={S:pick('stat'),P:pick('ship'),V:pick('vol')}; r.stat=r.S?cmpStat(r.S):null; r.ship=r.P?cmpShip(r.P):null; r.vol=r.V?cmpVol(r.V):null; GC.set('crcmp',r); return r }

 function viewSum(C){ const k=[];

 function viewStat(C){ if(!C.stat)return `<p class="note">${L('還沒有訂單總表。按上面「匯入報表」選 ALL CUSTOMER STATISTICS，或「讀生產平台」。','No statistics yet.')}</p>`;
